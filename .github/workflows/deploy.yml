name: Deploy BDShips

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Deploy on VPS as root
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "==> Git safe directory..."
            git config --global --add safe.directory /var/www/bdships || true

            echo "==> Pulling latest code..."
            cd /var/www/bdships
            git reset --hard
            git pull origin main
            git log -1 --oneline

            echo "==> Installing dependencies..."
            npm install --no-audit --no-fund

            echo "==> Building production bundle..."
            npm run build

            echo "==> Restarting PM2 (root)..."
            if pm2 describe bdships >/dev/null 2>&1; then
              pm2 restart bdships --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

            echo "==> Deployment completed successfully."